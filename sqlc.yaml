version: "2"
sql:
  - engine: "postgresql"
    queries: "db/sql"
    schema: "db/migrations"
    gen:
      go:
        out: "db/query"
        overrides:
          - db_type: "pg_catalog.timestamp"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "pg_catalog.timestamp"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true